<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Suivi TP — M. ISDDIKEN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#0f1117;color:#e0e3ef;min-height:100vh}

/* ─── MOT DE PASSE ─── */
#lock{position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px;padding:30px}
#lock h1{font-size:22px;font-weight:bold;color:#4d8ff5;text-align:center}
#lock p{font-size:13px;color:#666;text-align:center}
#pwd-inp{width:100%;max-width:280px;padding:14px 16px;background:#1a1d27;border:2px solid #2a2d3e;border-radius:10px;color:#e0e3ef;font-size:18px;text-align:center;letter-spacing:3px}
#pwd-inp:focus{outline:none;border-color:#4d8ff5}
#pwd-btn{width:100%;max-width:280px;padding:14px;background:#4d8ff5;color:#fff;font-size:15px;font-weight:bold;border:none;border-radius:10px;cursor:pointer}
#pwd-btn:active{opacity:.85}
#pwd-err{font-size:13px;color:#e85d5d;display:none}

/* ─── APP (cachée jusqu'au login) ─── */
#app{display:none;padding-bottom:85px}

/* HEADER */
#hdr{position:sticky;top:0;z-index:50;background:#0f1117;border-bottom:1px solid #2a2d3e}
#hdr-top{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 0}
.htitle{font-size:11px;color:#555;letter-spacing:.5px}
#clock{background:#1a1d27;color:#777;padding:3px 9px;border-radius:20px;font-size:12px;font-family:monospace;border:1px solid #2a2d3e}

/* TABS */
#tabs{display:flex;gap:5px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 10px 9px;border-radius:7px 7px 0 0;font-size:12px;font-weight:bold;cursor:pointer;background:#1a1d27;color:#555;border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:5px}
.tab.on{background:#141720;color:#e0e3ef;border-color:#2a2d3e}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tpg{font-size:10px;font-family:monospace;color:#444}
.tab.on .tpg{color:#777}

/* MAIN */
#main{padding:12px}

/* CARTE */
.bcard{display:flex;align-items:center;gap:12px;padding:13px;border-radius:10px;margin-bottom:10px;border:1px solid #2a2d3e}
.bcirc{width:50px;height:50px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.bs{font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.bn{font-size:24px;font-family:monospace;line-height:1}
.broom{font-size:18px;font-weight:bold}
.btask{font-size:12px;color:#888;margin-top:2px;line-height:1.3}

/* PROG */
.prow{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#1a1d27;border-radius:8px;margin-bottom:10px;border:1px solid #2a2d3e}
.pbar{flex:1;height:5px;background:#2a2d3e;border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .3s}
.ppct{font-size:12px;font-family:monospace;color:#777;min-width:38px;text-align:right}

/* NOTE */
.nbox{padding:11px 13px;background:#141720;border:1px solid #2a2d3e;border-radius:10px;margin-bottom:10px}
.nlbl{font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:8px}
.nrow{display:flex;gap:10px;align-items:flex-start}
.niw{display:flex;flex-direction:column;align-items:center;gap:2px}
.ni{width:66px;height:52px;background:#1a1d27;border:1px solid #3a3d4e;border-radius:7px;color:#e0e3ef;font-size:24px;text-align:center;font-family:monospace}
.ni:focus{outline:none;border-color:#4d8ff5}
.nd{font-size:11px;color:#555;font-family:monospace}
.obs{flex:1;height:56px;background:#1a1d27;border:1px solid #3a3d4e;border-radius:7px;color:#e0e3ef;font-size:13px;padding:8px 10px;resize:none}
.obs:focus{outline:none;border-color:#4d8ff5}
.obs::placeholder{color:#555}

/* PHASES */
.ph{border:1px solid #2a2d3e;border-radius:10px;margin-bottom:8px;overflow:hidden}
.phd{display:flex;align-items:center;gap:9px;padding:11px 12px;background:#141720;cursor:pointer;user-select:none;-webkit-user-select:none}
.pico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pm{flex:1}
.pnm{font-size:13px;font-weight:bold}
.ptm{font-size:11px;color:#555;margin-top:1px}
.pbg{font-size:11px;font-family:monospace;padding:2px 8px;border-radius:20px;background:#1a1d27;color:#555}
.pbg.full{background:rgba(63,207,142,.15);color:#3fcf8e}
.pch{color:#555;transition:transform .2s;flex-shrink:0}
.ph.open .pch{transform:rotate(180deg)}
.phb{display:none;background:#1a1d27}
.ph.open .phb{display:block}

/* ITEMS */
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-top:1px solid #2a2d3e;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .1s}
.ck:active{background:rgba(255,255,255,.03)}
.ck.on{background:rgba(63,207,142,.05)}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #3a3d4e;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ck.on .cb{background:#3fcf8e;border-color:#3fcf8e}
.cc{display:none}
.ck.on .cc{display:block}
.ct{flex:1}
.cl{font-size:13px;font-weight:600;line-height:1.35}
.ck.on .cl{text-decoration:line-through;color:#555}
.cs{font-size:11px;color:#555;margin-top:3px;line-height:1.4;font-style:italic}
.ccc{font-size:10px;font-family:monospace;padding:2px 6px;border-radius:4px;background:rgba(77,143,245,.15);color:#4d8ff5;flex-shrink:0;margin-top:3px}

/* BOTTOM */
#bot{position:fixed;bottom:0;left:0;right:0;background:#141720;border-top:1px solid #2a2d3e;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:100}
.btn{padding:13px 14px;border-radius:10px;border:none;font-size:13px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s,transform .1s;font-family:Arial,sans-serif}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.brst{background:#1a1d27;color:#888;border:1px solid #2a2d3e;flex:0 0 auto;padding:13px 16px}
.bdl{background:#4d8ff5;color:#fff;flex:1}
.blog{background:#1a1d27;color:#888;border:1px solid #2a2d3e;flex:0 0 auto;padding:13px 14px;font-size:11px}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:#3fcf8e;color:#0f1117;font-weight:bold;font-size:13px;padding:9px 20px;border-radius:20px;opacity:0;transition:all .3s;z-index:300;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ════ ÉCRAN MOT DE PASSE ════ -->
<div id="lock">
  <div style="font-size:40px">🔐</div>
  <h1>Suivi TP Électricité</h1>
  <p>M. ISDDIKEN · Lycée Champollion, Lattes<br>Accès réservé au professeur</p>
  <input id="pwd-inp" type="password" placeholder="••••••••" maxlength="30"
    onkeydown="if(event.key==='Enter')checkPwd()">
  <button id="pwd-btn" onclick="checkPwd()">Accéder</button>
  <span id="pwd-err">❌ Mot de passe incorrect</span>
</div>

<!-- ════ APPLICATION ════ -->
<div id="app">
  <div id="hdr">
    <div id="hdr-top">
      <span class="htitle">TP ÉLECTRICITÉ · NF C15-100</span>
      <span id="clock">--:--</span>
    </div>
    <div id="tabs"></div>
  </div>
  <div id="main"></div>
  <div id="bot">
    <button class="btn brst" onclick="resetBinome()" title="Réinitialiser ce binôme">↺</button>
    <button class="btn bdl" id="dlbtn" onclick="genererRapport()">⬇ Générer le rapport</button>
    <button class="btn blog" onclick="deconnect()">⎋</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   MOT DE PASSE
   !! Changez "MTNE2025" par votre mot de passe !!
════════════════════════════════════════ */
var MOT_DE_PASSE = "MTNE2025";

function checkPwd(){
  var v = document.getElementById('pwd-inp').value;
  if(v === MOT_DE_PASSE){
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('tp_auth','1');
    renderTabs(); renderMain(); tick();
  } else {
    document.getElementById('pwd-err').style.display = 'block';
    document.getElementById('pwd-inp').value = '';
    document.getElementById('pwd-inp').focus();
  }
}
function deconnect(){
  sessionStorage.removeItem('tp_auth');
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
// Persistance session (rechargement de page)
if(sessionStorage.getItem('tp_auth')==='1'){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
}

/* ════════════════════════════════════════
   DONNÉES
════════════════════════════════════════ */
var BIN = [
  {id:1,room:'Chambre 1', task:'Simple Allumage & Prise 16A',             col:'#2e75b6',bg:'rgba(46,117,182,.13)', hex:'2E75B6',hbg:'D6E4F0'},
  {id:2,room:'Couloir',   task:'Va-et-Vient · 2 points de commande',      col:'#c55a11',bg:'rgba(197,90,17,.13)',  hex:'C55A11',hbg:'FCE4D6'},
  {id:3,room:'Cuisine',   task:'Double Allumage & Prise commandée Hotte', col:'#548235',bg:'rgba(84,130,53,.13)',  hex:'548235',hbg:'E2EFDA'},
  {id:4,room:'Chambre 2', task:'Va-et-Vient & Prise 16A',                 col:'#9b4dca',bg:'rgba(155,77,202,.13)',hex:'9B4DCA',hbg:'EDE0F5'},
  {id:5,room:'Salon',     task:'Double Allumage & Prise TV',              col:'#c0392b',bg:'rgba(192,57,43,.13)', hex:'C0392B',hbg:'FDECEA'},
  {id:6,room:'Entrée',    task:'Va-et-Vient & Allumage Placard',          col:'#138496',bg:'rgba(19,132,150,.13)',hex:'138496',hbg:'D1F2F8'},
];

var PH = [
  {nm:'Arrivée & installation', tm:'14h00 – 14h15', ic:'📋', ib:'#1a2537', ic2:'#4d8ff5',
   it:[
    {l:'Tenue correcte (vêtements de travail)',   s:'Pas de bijoux — cheveux attachés si longs',              cc:'CC2'},
    {l:'Poste propre, matériel en place',          s:'Outils sortis, planche maquette posée, rien qui traîne',cc:'CC2'},
    {l:'Étiquette maquette collée & complétée',   s:'Noms des 2 élèves écrits lisiblement',                  cc:'CC2'},
    {l:'Sujet TP lu et compris',                   s:'Posez : "C\'est quoi votre mission ?"',                 cc:'CC1'},
  ]},
  {nm:'Phase schéma', tm:'14h15 – 14h40', ic:'✏️', ib:'#1e1630', ic2:'#a070f5',
   it:[
    {l:'Schéma unifilaire tracé AVANT câblage',   s:'Stylo + règle dehors — PAS les câbles',                cc:'CC1'},
    {l:'Symboles NF C15-100 utilisés',             s:'Interrupteur, douille, prise — pas de dessin libre',   cc:'CC3'},
    {l:'Sections de câbles indiquées sur schéma', s:'1,5 mm² éclairage / 2,5 mm² prises — écrit dessus',    cc:'CC3'},
    {l:'Zone localisée sur le plan architectural', s:'Ils pointent leur pièce — pas juste "je sais"',        cc:'CC1'},
  ]},
  {nm:'Câblage en cours', tm:'14h40 – 15h30', ic:'⚡', ib:'#162516', ic2:'#3fcf8e',
   it:[
    {l:'Couleurs conducteurs respectées',          s:'Phase rouge/marron · Neutre bleu · PE vert/jaune',     cc:'CC4'},
    {l:'Dénudage propre : 10 mm précis',           s:'Pas de stries, pas de cuivre visible hors borne',      cc:'CC4'},
    {l:'Phase coupée par l\'interrupteur',         s:'Posez : "Tu coupes quoi ?" → réponse : la phase',     cc:'CC4'},
    {l:'Aucune connexion volante / hors boîte',    s:'Toute jonction dans appareillage ou boîte fermée',     cc:'CC4'},
    {l:'Polarité prise respectée',                 s:'Phase à droite, neutre à gauche, PE en haut',          cc:'CC4'},
    {l:'Disjoncteur calibré & étiqueté',           s:'10A éclairage · 16A prise · identifié au tableau',     cc:'CC4'},
  ]},
  {nm:'Contrôle final', tm:'15h30 – 15h45', ic:'✅', ib:'#1e1c0e', ic2:'#f5a623',
   it:[
    {l:'Vérification visuelle faite par l\'élève', s:'Posez : "T\'as vérifié ?" avant toute mise sous tension',cc:'CC5'},
    {l:'Installation fonctionne au 1er essai',     s:'Allumage OK, prise OK, disjoncteur ne saute pas',      cc:'CC6'},
    {l:'L\'élève explique son câblage',            s:'Posez : "Pourquoi 1,5 mm² ici ?" — il répond seul',   cc:'CC8'},
  ]},
  {nm:'Rangement & questions théo.', tm:'15h45 – 16h00', ic:'📝', ib:'#1e1212', ic2:'#e85d5d',
   it:[
    {l:'Poste rangé, outils nettoyés',             s:'Câbles enroulés, rien au sol',                         cc:'CC2'},
    {l:'Questions individuelles répondues',        s:'Chacun répond seul, sans copier',                      cc:'CC8'},
    {l:'Grille d\'évaluation complétée',           s:'Note pratique + théorie = note finale /20',            cc:'CC8'},
  ]},
];

var TOTAL = PH.reduce(function(a,p){return a+p.it.length;},0);

/* ════════════════════════════════════════
   ÉTAT
════════════════════════════════════════ */
var cur = 0;
var S = BIN.map(function(){
  return {ck: PH.map(function(p){return Array(p.it.length).fill(false);}), note:'', obs:'', op:[0]};
});
function st(){return S[cur];}
function done(i){return S[i].ck.reduce(function(a,r){return a+r.filter(Boolean).length;},0);}
function pct(i){return Math.round(done(i)/TOTAL*100);}

/* ════════════════════════════════════════
   HORLOGE
════════════════════════════════════════ */
function tick(){
  if(document.getElementById('app').style.display==='none') return;
  var n=new Date();
  document.getElementById('clock').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
}
setInterval(tick,10000);

/* ════════════════════════════════════════
   RENDU
════════════════════════════════════════ */
function renderTabs(){
  document.getElementById('tabs').innerHTML = BIN.map(function(b,i){
    return '<div class="tab'+(i===cur?' on':'')+'" onclick="go('+i+')">'
      +'<span class="tdot" style="background:'+b.col+'"></span>'
      +'B'+b.id
      +'<span class="tpg">'+done(i)+'/'+TOTAL+'</span></div>';
  }).join('');
}

function renderMain(){
  var b=BIN[cur], s=st(), d=done(cur), p=pct(cur);
  var h='';

  h+='<div class="bcard" style="background:'+b.bg+';border-color:'+b.col+'44">'
    +'<div class="bcirc" style="background:'+b.col+'22;border:2px solid '+b.col+'44">'
    +'<span class="bs" style="color:'+b.col+'">Bin.</span>'
    +'<span class="bn" style="color:'+b.col+'">'+b.id+'</span></div>'
    +'<div><div class="broom">'+b.room+'</div><div class="btask">'+b.task+'</div></div></div>';

  h+='<div class="prow">'
    +'<div class="pbar"><div class="pfill" style="width:'+p+'%;background:'+(p===100?'#3fcf8e':b.col)+'"></div></div>'
    +'<div class="ppct" style="color:'+(p===100?'#3fcf8e':'#777')+'">'+d+'/'+TOTAL+'</div></div>';

  h+='<div class="nbox"><div class="nlbl">Note & observations</div>'
    +'<div class="nrow"><div class="niw">'
    +'<input class="ni" type="number" min="0" max="20" placeholder="--" value="'+s.note+'" oninput="S[cur].note=this.value">'
    +'<span class="nd">/ 20</span></div>'
    +'<textarea class="obs" placeholder="Observations, erreurs, points faibles…" oninput="S[cur].obs=this.value">'+s.obs+'</textarea>'
    +'</div></div>';

  PH.forEach(function(ph,pi){
    var pd=s.ck[pi].filter(Boolean).length, io=s.op.indexOf(pi)>=0;
    h+='<div class="ph'+(io?' open':'')+'" id="ph'+pi+'">'
      +'<div class="phd" onclick="tph('+pi+')">'
      +'<div class="pico" style="background:'+ph.ib+';color:'+ph.ic2+'">'+ph.ic+'</div>'
      +'<div class="pm"><div class="pnm">'+ph.nm+'</div><div class="ptm">'+ph.tm+'</div></div>'
      +'<span class="pbg'+(pd===ph.it.length?' full':'')+'">'+pd+'/'+ph.it.length+'</span>'
      +'<svg class="pch" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
      +'</div><div class="phb">';
    ph.it.forEach(function(it,ii){
      var ok=s.ck[pi][ii];
      h+='<div class="ck'+(ok?' on':'')+'" onclick="tog('+pi+','+ii+')">'
        +'<div class="cb"><svg class="cc" width="12" height="12" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 12 12"><path d="M1.5 6L4.5 9L10.5 3"/></svg></div>'
        +'<div class="ct"><div class="cl">'+it.l+'</div><div class="cs">'+it.s+'</div></div>'
        +'<span class="ccc">'+it.cc+'</span></div>';
    });
    h+='</div></div>';
  });

  document.getElementById('main').innerHTML = h;
}

function go(i){cur=i; renderTabs(); renderMain(); window.scrollTo(0,0);}
function tph(pi){
  var s=st(), idx=s.op.indexOf(pi);
  if(idx>=0) s.op.splice(idx,1); else s.op.push(pi);
  renderMain();
}
function tog(pi,ii){
  var s=st();
  s.ck[pi][ii]=!s.ck[pi][ii];
  if(s.ck[pi].every(Boolean)&&pi<PH.length-1&&s.op.indexOf(pi+1)<0) s.op.push(pi+1);
  renderTabs(); renderMain();
}
function resetBinome(){
  if(!confirm('Réinitialiser binôme '+BIN[cur].id+' — '+BIN[cur].room+' ?')) return;
  S[cur]={ck:PH.map(function(p){return Array(p.it.length).fill(false);}),note:'',obs:'',op:[0]};
  renderTabs(); renderMain();
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2800);
}

/* ════════════════════════════════════════
   GÉNÉRATION RAPPORT (HTML → impression PDF)
════════════════════════════════════════ */
function genererRapport(){
  var now=new Date();
  var ds=('0'+now.getDate()).slice(-2)+'/'+('0'+(now.getMonth()+1)).slice(-2)+'/'+now.getFullYear()
      +' '+('0'+now.getHours()).slice(-2)+'h'+('0'+now.getMinutes()).slice(-2);

  var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">'
    +'<title>Suivi TP Electricite</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:Arial,sans-serif;font-size:11pt;color:#111;background:#fff;padding:15mm}'
    +'h1{font-size:16pt;color:#1F4E79;margin-bottom:4px}'
    +'h2{font-size:12pt;margin:18px 0 6px;padding:6px 10px;border-radius:4px}'
    +'.sub{font-size:9pt;color:#666;margin-bottom:16px}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:14px}'
    +'th{background:#1F4E79;color:#fff;padding:6px 8px;font-size:10pt;text-align:left}'
    +'td{padding:5px 8px;font-size:10pt;border:1px solid #ddd;vertical-align:top}'
    +'.ok{color:#375623;font-weight:bold} .ko{color:#aaa}'
    +'.stat-full{background:#E2EFDA;color:#375623;font-weight:bold}'
    +'.stat-mid{background:#FFF2CC;color:#7B5E00}'
    +'.stat-low{background:#FDECEA;color:#7B1F1F}'
    +'.note-val{font-weight:bold;font-size:13pt}'
    +'@media print{body{padding:10mm} .noprint{display:none}}'
    +'</style></head><body>';

  html+='<h1>Suivi TP Électricité — NF C15-100</h1>'
    +'<div class="sub">M. ISDDIKEN · Lycée Champollion, Lattes · 2nde PRO MTNE · Généré le '+ds+'</div>';

  /* ── SYNTHÈSE GÉNÉRALE ── */
  html+='<h2 style="background:#e8eef6;color:#1F4E79">Synthèse générale</h2>';
  html+='<table><tr><th>Binôme</th><th>Zone / Tâche</th><th style="width:100px;text-align:center">Avancement</th><th style="width:70px;text-align:center">Note /20</th><th>Observations</th></tr>';
  BIN.forEach(function(b,i){
    var d=done(i), p=pct(i), s=S[i];
    var cls=p===100?'stat-full':(p>=50?'stat-mid':'stat-low');
    html+='<tr>'
      +'<td style="font-weight:bold;color:#'+b.hex+'">B'+b.id+' — '+b.room+'</td>'
      +'<td>'+b.task+'</td>'
      +'<td class="'+cls+'" style="text-align:center">'+d+'/'+TOTAL+' ('+p+'%)</td>'
      +'<td style="text-align:center" class="note-val">'+(s.note||'—')+'</td>'
      +'<td style="font-size:9pt;font-style:italic">'+(s.obs||'—')+'</td>'
      +'</tr>';
  });
  html+='</table>';

  /* ── DÉTAIL PAR BINÔME ── */
  BIN.forEach(function(b,i){
    var s=S[i], d=done(i), p=pct(i);
    html+='<h2 style="background:#'+b.hbg+';color:#'+b.hex+';border-left:5px solid #'+b.hex+'">'
      +'Binôme '+b.id+' — '+b.room
      +'<span style="font-weight:normal;font-size:10pt;color:#666"> · '+b.task+'</span>'
      +'<span style="float:right;font-size:10pt">'+d+'/'+TOTAL+' ('+p+'%)'
      +(s.note?' — Note : <b>'+s.note+'/20</b>':'')+'</span></h2>';

    if(s.obs) html+='<p style="font-size:9pt;color:#444;margin-bottom:8px;padding:5px 10px;background:#f9f9f9;border-left:3px solid #'+b.hex+'">'+s.obs+'</p>';

    html+='<table>';
    html+='<tr><th style="width:30px">#</th><th>Point de vérification</th><th style="width:60px;text-align:center">CC</th><th style="width:40px;text-align:center">✓</th></tr>';

    var n=1;
    PH.forEach(function(ph,pi){
      html+='<tr><td colspan="4" style="background:#f0f0f0;font-weight:bold;padding:5px 8px;font-size:10pt">'+ph.ic+' '+ph.nm+' <span style="font-weight:normal;color:#888;font-size:9pt">'+ph.tm+'</span></td></tr>';
      ph.it.forEach(function(it,ii){
        var ok=s.ck[pi][ii];
        html+='<tr style="'+(ok?'background:#f6fbf8;':'')+'">'
          +'<td style="text-align:center;color:#aaa;font-size:9pt">'+n+'</td>'
          +'<td>'+(ok?'<span style="color:#375623">✓ ':'<span style="color:#bbb">○ ')+it.l+'</span>'
          +'<br><span style="font-size:8pt;color:#999;font-style:italic">'+it.s+'</span></td>'
          +'<td style="text-align:center;font-size:9pt;color:#4d8ff5;font-weight:bold">'+it.cc+'</td>'
          +'<td style="text-align:center;font-size:14pt">'+(ok?'<span class="ok">☑</span>':'<span class="ko">☐</span>')+'</td>'
          +'</tr>';
        n++;
      });
    });
    html+='</table>';
  });

  html+='<div class="noprint" style="text-align:center;margin-top:20px">'
    +'<button onclick="window.print()" style="padding:12px 30px;background:#1F4E79;color:#fff;font-size:14px;font-weight:bold;border:none;border-radius:8px;cursor:pointer">🖨 Imprimer / Enregistrer en PDF</button>'
    +'</div>';

  html+='<script>window.onload=function(){window.print();}<\/script>';
  html+='</body></html>';

  var w=window.open('','_blank');
  if(w){
    w.document.write(html);
    w.document.close();
    toast('✓ Rapport ouvert — imprimez ou enregistrez en PDF');
  } else {
    toast('⚠ Autorisez les popups pour générer le rapport');
  }
}
